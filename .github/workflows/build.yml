name: Build Windows .exe

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - ".gitignore"
  workflow_dispatch:  # manual trigger

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install rich psutil pyinstaller

      - name: Build .exe
        working-directory: build
        run: |
          pyinstaller steamcast.spec

      - name: Zip artifact
        shell: pwsh
        run: |
          Compress-Archive -Path build/dist/steamcast.exe -DestinationPath steamcast-windows.zip

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: steamcast-windows
          path: steamcast-windows.zip
          retention-days: 30

      - name: Upload to release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: steamcast-windows.zip
